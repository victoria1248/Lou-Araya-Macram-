version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: louaraya_postgres
    restart: always
    environment:
      POSTGRES_DB: louaraya_db
      POSTGRES_USER: louaraya_user
      POSTGRES_PASSWORD: macrame_secure_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U louaraya_user -d louaraya_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: louaraya_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/louaraya_db
      SPRING_DATASOURCE_USERNAME: louaraya_user
      SPRING_DATASOURCE_PASSWORD: macrame_secure_2026
      JWT_SECRET: 4f9a72c1d3e5b8a6f0192837465abcde9876543210fedcba123456789abcdef0
      JWT_EXPIRATION_MS: 86400000
      PORT: 8080

volumes:
  postgres_data:

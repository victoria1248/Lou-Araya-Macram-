server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: louaraya-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/louaraya_db}
    username: ${SPRING_DATASOURCE_USERNAME:louaraya_user}
    password: ${SPRING_DATASOURCE_PASSWORD:macrame_secure_2026}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Seguridad y Token JWT
jwt:
  secret: ${JWT_SECRET:4f9a72c1d3e5b8a6f0192837465abcde9876543210fedcba123456789abcdef0}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 horas

# Documentación Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Configuración CORS para pruebas y emulador Android
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://10.0.2.2:8080,http://127.0.0.1:8080}
